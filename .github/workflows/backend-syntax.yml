name: Backend syntax verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend Python
        run: |
          python -m py_compile nexus.py persistence/core.py persistence/service.py persistence/migrations.py

      - name: Compile all Python modules
        run: |
          python -m compileall -q .

      - name: Test autonomous absorption contract
        run: |
          python -m unittest persistence.test_absorption -v
          python -m unittest persistence.test_absorption_target -v
          python -m unittest persistence.test_autonomous_candidate -v

      - name: Test chat action integrity
        run: |
          python -m unittest persistence.test_chat_action_integrity -v

      - name: Test learning consolidation gate
        run: |
          python -m unittest persistence.test_consolidation_gate -v

      - name: Test provider failover
        run: |
          python -m unittest test_provider_failover -v

      - name: Test identity root contract
        run: |
          python -m unittest test_identity_root_contract -v

      - name: Test capability engine contract
        run: |
          python -m unittest test_capability_engine_contract -v

      - name: Test authentication and authorization contract
        run: |
          python -m unittest test_authorization_contract -v

      - name: Test session authentication capability contract
        run: |
          python -m unittest test_session_auth_contract -v

      - name: Test persistent memory capability contract
        run: |
          python -m unittest test_persistent_memory_contract -v

      - name: Install backend runtime dependencies for contract tests
        run: |
          python -m pip install -r requirements.txt

      - name: Test memory recall capability contract
        run: |
          python -m unittest test_memory_recall_contract -v

      - name: Test learning persistent capability contract
        run: |
          python -m unittest test_learning_persistent_contract -v

      - name: Test route hardening contract
        run: |
          python -m unittest test_route_security_contract -v

      - name: Test conversation ownership contract
        run: |
          python -m unittest test_conversation_ownership -v

      - name: Test graph ownership contract
        run: |
          python -m unittest test_graph_ownership -v

      - name: Test learning and cognitive ownership contract
        run: |
          python -m unittest test_learning_cognitive_ownership -v

      - name: Test memory embedding ownership contract
        run: |
          python -m unittest test_memory_embedding_ownership -v

      - name: Test mission and task ownership contract
        run: |
          python -m unittest test_mission_task_ownership -v

      - name: Test mission route ownership contract
        run: |
          python -m unittest test_authorization_contract -v

      - name: Test multimedia contract and authenticated PDF flow
        run: |
          python -m unittest test_multimedia_contract -v

      - name: Guard route ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("nexus.py").read_text(encoding="utf-8")
          selftest = text.index('@app.get("/api/v8/learning/selftest")')
          dynamic_marker = '@app.get("/api/v8/learning/{learning_id}")'
          if dynamic_marker in text:
              dynamic = text.index(dynamic_marker)
              assert selftest < dynamic, "Learning selftest route must be declared before dynamic learning_id route"
          assert '@app.get("/api/v8/memory/semantic-selftest")' in text
          assert '@app.post("/api/v8/memory/semantic-reindex")' in text
          assert text.count('@app.get("/health")') == 1, "Health route must be registered exactly once"

          stream_start = text.index('@app.post("/api/chat/stream")')
          stream_body = text[stream_start:]
          stream_teaching = stream_body.index('teaching_lesson, teaching_mode = _extract_teaching_lesson(msg)')
          stream_shadow = stream_body.index('_run_absorption_shadow')
          assert stream_teaching < stream_shadow, "Stream teaching branch must run before absorption shadow"
          assert 'return StreamingResponse(generate_teaching(), media_type="text/event-stream")' in stream_body
          print("route ordering, health registration, and stream teaching guard OK")
