name: Backend syntax verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend Python
        run: |
          python -m py_compile nexus.py autonomy_engine.py github_controlled.py persistence/autonomy.py persistence/core.py persistence/service.py persistence/migrations.py persistence/repair.py

      - name: Compile all Python modules
        run: |
          python -m compileall -q .

      - name: Test autonomous absorption contract
        run: |
          python -m unittest persistence.test_absorption -v
          python -m unittest persistence.test_absorption_target -v
          python -m unittest persistence.test_autonomous_candidate -v

      - name: Test chat action integrity
        run: |
          python -m unittest persistence.test_chat_action_integrity -v

      - name: Test learning consolidation gate
        run: |
          python -m unittest persistence.test_consolidation_gate -v

      - name: Test provider failover
        run: |
          python -m unittest test_provider_failover -v

      - name: Test identity root contract
        run: |
          python -m unittest test_identity_root_contract -v

      - name: Test capability engine contract
        run: |
          python -m unittest test_capability_engine_contract -v

      - name: Test authentication and authorization contract
        run: |
          python -m unittest test_authorization_contract -v

      - name: Test tool registry contract
        run: |
          python -m unittest test_tool_registry_contract -v

      - name: Test session authentication capability contract
        run: |
          python -m unittest test_session_auth_contract -v

      - name: Test persistent memory capability contract
        run: |
          python -m unittest test_persistent_memory_contract -v

      - name: Install backend runtime dependencies for contract tests
        run: |
          python -m pip install -r requirements.txt

      - name: Test F8 tool-audit cleanup contract
        run: |
          python -m unittest test_tool_audit_cleanup_contract -v

      - name: Test memory recall capability contract
        run: |
          python -m unittest test_memory_recall_contract -v

      - name: Test memory gate fail-closed contract
        run: |
          python -m unittest test_memory_gate_contract -v

      - name: Test learning persistent capability contract
        run: |
          python -m unittest test_learning_persistent_contract -v

      - name: Test route hardening contract
        run: |
          python -m unittest test_route_security_contract -v

      - name: Test conversation ownership contract
        run: |
          python -m unittest test_conversation_ownership -v

      - name: Test graph persistent capability contract
        run: |
          python -m unittest test_graph_persistent_contract -v

      - name: Test graph ownership contract
        run: |
          python -m unittest test_graph_ownership -v

      - name: Test first-class knowledge persistence contract
        run: |
          python -m unittest test_knowledge_persistent_contract -v

      - name: Test learning and cognitive ownership contract
        run: |
          python -m unittest test_learning_cognitive_ownership -v

      - name: Test memory embedding ownership contract
        run: |
          python -m unittest test_memory_embedding_ownership -v

      - name: Test mission and task ownership contract
        run: |
          python -m unittest test_mission_task_ownership -v

      - name: Test F10 mission hardening contract
        run: |
          python -m unittest test_f10_mission_hardening_contract -v
          python -m unittest test_conversation_idempotency -v

      - name: Test repair engine contract
        run: |
          python -m unittest test_repair_engine_contract -v
      - name: Test evolution engine contract
        run: |
          python -m unittest test_evolution_engine_contract -v
      - name: Test controlled autonomy contract
        run: |
          python -m unittest test_controlled_autonomy_contract -v


      - name: Test self-knowledge contract
        run: |
          python -m unittest test_self_knowledge_contract -v

      - name: Test agent semantic contract
        run: |
          python -m unittest test_agent_contract -v

      - name: Test agent audit contract
        run: |
          python -m unittest test_agent_audit_contract -v

      - name: Test specialized agent contract
        run: |
          python -m unittest test_specialized_agents_contract -v

      - name: Test specialized mission wiring contract
        run: |
          python -m unittest test_specialized_agent_mission_wiring -v

      - name: Test mission route ownership contract
        run: |
          python -m unittest test_authorization_contract -v

      - name: Test multimedia contract and authenticated PDF flow
        run: |
          python -m unittest test_multimedia_contract -v

      - name: Guard route ordering
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("nexus.py").read_text(encoding="utf-8")
          selftest = text.index('@app.get("/api/v8/learning/selftest")')
          dynamic_marker = '@app.get("/api/v8/learning/{learning_id}")'
          if dynamic_marker in text:
              dynamic = text.index(dynamic_marker)
              assert selftest < dynamic, "Learning selftest route must be declared before dynamic learning_id route"
          assert '@app.get("/api/v8/memory/semantic-selftest")' in text
          assert '@app.post("/api/v8/memory/semantic-reindex")' in text
          assert text.count('@app.get("/health")') == 1, "Health route must be registered exactly once"

          chat_start = text.index('@app.post("/api/chat")')
          stream_start = text.index('@app.post("/api/chat/stream")')
          chat_body = text[chat_start:stream_start]
          assert 'teaching_lesson, teaching_mode = _extract_teaching_lesson(msg)' in chat_body
          assert chat_body.index('teaching_lesson, teaching_mode = _extract_teaching_lesson(msg)') < chat_body.index('_run_absorption_shadow'), "Chat teaching branch must run before absorption shadow"
          stream_body = text[stream_start:]
          assert 'cloned_request = Request(request.scope, receive=receive)' in stream_body
          assert 'result = await chat(cloned_request)' in stream_body
          assert 'teaching_lesson, teaching_mode = _extract_teaching_lesson(msg)' not in stream_body
          assert '_run_absorption_shadow' not in stream_body
          print("route ordering, health registration, canonical chat teaching, and single-source SSE guard OK")