name: AKIRA Free Tier Keepalive 24/7 (Anti-Sleep)
on:
  schedule:
    - cron: '*/7 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Health Endpoint
        run: |
          echo "⚡ Sending keepalive ping to Akira backend..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" --max-time 20 --retry 2 https://akira-empresa.onrender.com/health)
          echo "$RESPONSE"
          echo "✅ Backend kept warm and active without cold starts."
