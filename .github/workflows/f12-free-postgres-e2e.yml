name: F12 free PostgreSQL end-to-end verification

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  f12-postgres-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: akira_f12_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d akira_f12_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and HTTP test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt httpx

      - name: Create test-only PostgreSQL roles required by migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d akira_f12_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN" \
            -c "CREATE ROLE authenticated NOLOGIN"

      - name: Run F12 API lifecycle against disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/akira_f12_test
        run: |
          python -m unittest persistence.test_postgres_migration_statements -v
          python -m unittest test_f12_repair_postgres_e2e -v
          python -m unittest test_f15_hive_postgres_e2e -v
